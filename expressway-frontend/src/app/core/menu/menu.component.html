<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <!-- Logo -->
    <a class="navbar-brand fw-bold" routerLink="/consignments">
      <i class="fas fa-shipping-fast me-2"></i>ExpressWay
    </a>

    <!-- Mobile Toggle Button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible Navigation -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Dashboard -->
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/consignments"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="fas fa-tachometer-alt me-1"></i>
            <span class="d-lg-inline d-md-none">Dashboard</span>
          </a>
        </li>

        <!-- Booking -->
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/booking"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="fas fa-plus-circle me-1"></i>
            <span class="d-lg-inline d-md-none">Booking</span>
          </a>
        </li>

        <!-- Client Management -->
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/client" routerLinkActive="active">
            <i class="fas fa-users me-1"></i>
            <span class="d-lg-inline d-md-none">Clients</span>
          </a>
        </li>

        <!-- Billings -->
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/billings"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="fas fa-file-invoice me-1"></i>
            <span class="d-lg-inline d-md-none">Billings</span>
          </a>
        </li>
      </ul>

      <!-- User Info and Logout -->
      <div class="d-flex align-items-center">
        <div class="navbar-text text-white me-3 d-none d-md-block">
          <i class="fas fa-user-circle me-1"></i>
          Welcome, <span class="fw-bold">Sushil</span>
        </div>
        
        <!-- Logout Button -->
        <button 
          class="btn btn-outline-light btn-sm" 
          type="button" 
          (click)="logout()"
          title="Logout"
        >
          <i class="fas fa-sign-out-alt me-1"></i>
          <span class="d-none d-sm-inline">Logout</span>
        </button>
      </div>
    </div>
  </div>
</nav>
