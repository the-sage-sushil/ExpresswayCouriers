<!-- Desktop Navbar -->
<nav class="navbar navbar-dark bg-primary shadow-sm d-none d-lg-flex">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/consignments">
      <i class="fas fa-shipping-fast me-2"></i>ExpressWay
    </a>

    <ul class="navbar-nav d-flex flex-row me-auto">
      <li class="nav-item me-3">
        <a class="nav-link" routerLink="/consignments" routerLinkActive="active">
          <i class="fas fa-tachometer-alt me-1"></i>Dashboard
        </a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link" routerLink="/booking" routerLinkActive="active">
          <i class="fas fa-plus-circle me-1"></i>Booking
        </a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link" routerLink="/client" routerLinkActive="active">
          <i class="fas fa-users me-1"></i>Clients
        </a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link" routerLink="/billings" routerLinkActive="active">
          <i class="fas fa-file-invoice me-1"></i>Billings
        </a>
      </li>
    </ul>

    <div class="d-flex align-items-center">
      <span class="navbar-text text-white me-3">
        <i class="fas fa-user-circle me-1"></i>Welcome, <span class="fw-bold">Sushil</span>
      </span>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Top Bar -->
<nav class="mobile-topbar d-lg-none">
  <div class="d-flex justify-content-between align-items-center p-3">
    <button class="btn btn-primary" (click)="toggleMobileMenu()">
      <i class="fas fa-bars"></i>
    </button>
    <a class="navbar-brand text-primary fw-bold" routerLink="/consignments">
      <i class="fas fa-shipping-fast me-1"></i>ExpressWay
    </a>
    <button class="btn btn-outline-primary btn-sm" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </div>
</nav>

<!-- Mobile Side Menu -->
<div class="mobile-sidebar" [class.open]="isMobileMenuOpen">
  <div class="sidebar-header">
    <h5 class="text-white mb-0">
      <i class="fas fa-shipping-fast me-2"></i>ExpressWay
    </h5>
    <button class="btn btn-link text-white p-0" (click)="closeMobileMenu()">
      <i class="fas fa-times fa-lg"></i>
    </button>
  </div>
  
  <div class="sidebar-content">
    <div class="user-info">
      <i class="fas fa-user-circle me-2"></i>
      <span>Welcome, <strong>Sushil</strong></span>
    </div>
    
    <ul class="sidebar-nav">
      <li>
        <a routerLink="/consignments" routerLinkActive="active" (click)="closeMobileMenu()">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/booking" routerLinkActive="active" (click)="closeMobileMenu()">
          <i class="fas fa-plus-circle"></i>
          <span>Booking</span>
        </a>
      </li>
      <li>
        <a routerLink="/client" routerLinkActive="active" (click)="closeMobileMenu()">
          <i class="fas fa-users"></i>
          <span>Clients</span>
        </a>
      </li>
      <li>
        <a routerLink="/billings" routerLinkActive="active" (click)="closeMobileMenu()">
          <i class="fas fa-file-invoice"></i>
          <span>Billings</span>
        </a>
      </li>
    </ul>
  </div>
</div>

<!-- Mobile Overlay -->
<div class="mobile-overlay" [class.show]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
