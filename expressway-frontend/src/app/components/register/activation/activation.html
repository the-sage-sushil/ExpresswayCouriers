<div class="activation-wrapper">
  <div class="container-fluid">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        
        <!-- Success/Error Result -->
        <div class="card shadow-lg border-0" *ngIf="submitted else codeForm">
          <div class="card-header text-white text-center py-4" 
               [class.bg-success]="isOkay" 
               [class.bg-danger]="!isOkay">
            <i class="fa-2x mb-2" 
               [class.fas]="true"
               [class.fa-check-circle]="isOkay"
               [class.fa-times-circle]="!isOkay"></i>
            <h3 class="mb-0">{{ isOkay ? 'Activation Successful!' : 'Activation Failed!' }}</h3>
          </div>
          <div class="card-body p-4 text-center">
            <div *ngIf="isOkay; else activationError">
              <p class="mb-4">Your account has been successfully activated. You can now sign in to your account.</p>
              <button class="btn btn-success btn-lg" (click)="redirectToLogin()">
                <i class="fas fa-sign-in-alt me-2"></i>Go to Login
              </button>
            </div>
            <ng-template #activationError>
              <p class="mb-4 text-danger">{{ message }}</p>
              <div class="d-grid gap-2">
                <button class="btn btn-primary" (click)="submitted = false">
                  <i class="fas fa-redo me-2"></i>Try Again
                </button>
                <button class="btn btn-outline-secondary" (click)="redirectToLogin()">
                  <i class="fas fa-arrow-left me-2"></i>Back to Login
                </button>
              </div>
            </ng-template>
          </div>
        </div>
        
        <!-- Code Input Form -->
        <ng-template #codeForm>
          <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-4">
              <i class="fas fa-key fa-2x mb-2"></i>
              <h3 class="mb-0">Account Activation</h3>
              <p class="mb-0 mt-2 opacity-75">Enter the 6-digit code sent to your email</p>
            </div>
            <div class="card-body p-4 text-center">
              <div class="mb-4">
                <code-input 
                  [isCodeHidden]="false"
                  [codeLength]="6"
                  [code]="'number'"
                  (codeCompleted)="onCodeCompleted($event)">
                </code-input>
              </div>
              
              <div class="d-grid gap-2">
                <button class="btn btn-outline-secondary" (click)="redirectToLogin()">
                  <i class="fas fa-arrow-left me-2"></i>Back to Login
                </button>
              </div>
              
              <div class="mt-3">
                <small class="text-muted">
                  Didn't receive the code? Check your spam folder or contact support.
                </small>
              </div>
            </div>
          </div>
        </ng-template>
        
      </div>
    </div>
  </div>
</div>
