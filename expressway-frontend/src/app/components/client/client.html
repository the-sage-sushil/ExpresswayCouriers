<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card">
        <div class="card-header">
          <h3>Client Management</h3>
        </div>
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Client List</h5>
            <button (click)="addClient()" class="btn btn-primary">Add New Client</button>
          </div>

          <div *ngIf="clients.length === 0 && !loading" class="alert alert-info">
            No clients found.
          </div>

          <div *ngIf="loading" class="alert alert-info">
            Loading...
          </div>

          <div *ngIf="clients.length > 0" class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Contact Number</th>
                  <th>Address</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let client of clients">
                  <td>{{ client.name }}</td>
                  <td>{{ client.email }}</td>
                  <td>{{ client.contactNumber }}</td>
                  <td>{{ client.address }}</td>
                  <td>
                    <button class="btn btn-sm btn-primary me-2" (click)="editClient(client)">Edit</button>
                    <button class="btn btn-sm btn-danger" (click)="deleteClient(client)">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
