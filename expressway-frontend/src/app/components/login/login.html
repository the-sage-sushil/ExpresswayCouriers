<div class="login-wrapper">
  <div class="container-fluid">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0">
          <div class="card-header bg-primary text-white text-center py-4">
            <i class="fas fa-shipping-fast fa-2x mb-2"></i>
            <h3 class="mb-0">ExpressWay Login</h3>
          </div>
          <div class="card-body p-4">
            <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length > 0">
              <i class="fas fa-exclamation-triangle me-2"></i>
              <div *ngFor="let msg of errorMsg">{{ msg }}</div>
            </div>
            
            <form>
              <div class="mb-3">
                <label for="login" class="form-label fw-semibold">
                  <i class="fas fa-envelope me-2"></i>Email Address
                </label>
                <input
                  [(ngModel)]="authRequest.email"
                  type="email"
                  class="form-control form-control-lg"
                  id="login"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
              
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                  <i class="fas fa-lock me-2"></i>Password
                </label>
                <input
                  [(ngModel)]="authRequest.password"
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                />
              </div>
              
              <button 
                (click)="login()" 
                type="button" 
                class="btn btn-primary btn-lg w-100 mb-3"
              >
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
              </button>
            </form>
            
            <div class="text-center">
              <p class="mb-0">Don't have an account?</p>
              <button 
                type="button" 
                class="btn btn-link p-0" 
                (click)="register()"
              >
                <i class="fas fa-user-plus me-1"></i>Create Account
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
